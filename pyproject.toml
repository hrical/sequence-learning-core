[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-learning-core"
version = "0.1.0"
description = "Selected experimental core for sequential recommendation research"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "transformers==4.52.3", "accelerate>=0.26,<2"]

[tool.setuptools.packages.find]
include = ["sddrec_core*"]
